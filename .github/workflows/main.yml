
name: GitLab and GitHub Pages Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pages-bidirectional-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Pages Sync Bot"
          git config user.email "pages-sync[bot]@users.noreply.github.com"

      - name: Add GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is missing."
            exit 1
          fi

          git remote add gitlab \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/chantinlongxthrx/i-steam.github.io.git"

      - name: Fetch both repositories
        run: |
          git fetch origin main
          git fetch gitlab main

      - name: Reconcile repository histories
        id: reconcile
        run: |
          set -e

          GH_SHA="$(git rev-parse origin/main)"
          GL_SHA="$(git rev-parse gitlab/main)"

          echo "GitHub: $GH_SHA"
          echo "GitLab: $GL_SHA"

          if [ "$GH_SHA" = "$GL_SHA" ]; then
            echo "Both repositories are already synchronized."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$GL_SHA" "$GH_SHA"; then
            echo "GitHub is ahead. Keeping GitHub history."
            git checkout -B main "$GH_SHA"

          elif git merge-base --is-ancestor "$GH_SHA" "$GL_SHA"; then
            echo "GitLab is ahead. Updating local branch."
            git checkout -B main "$GL_SHA"

          else
            echo "Both repositories contain unique commits."
            git checkout -B main "$GH_SHA"

            if ! git merge --no-ff --no-edit gitlab/main; then
              git merge --abort || true
              echo "::error::Merge conflict detected. No repository was overwritten."
              exit 1
            fi
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push merged history to GitLab
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          git push gitlab HEAD:main

      - name: Push merged history to GitHub
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Report synchronization
        run: |
          echo "Synchronization workflow completed."
