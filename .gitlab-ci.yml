stages:
  - sync

sync_from_github:
  stage: sync
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache git
  script:
    - test -n "${GITLAB_TOKEN}" || (echo "Add a masked GitLab CI/CD variable named GITLAB_TOKEN with write_repository access." && exit 1)
    - git clone --branch main --single-branch https://github.com/I-Steam/I-steam.github.io.git source
    - cd source
    - git config user.name "GitLab mirror bot"
    - git config user.email "mirror-bot@example.invalid"
    - git remote add target "https://oauth2:${GITLAB_TOKEN}@gitlab.com/chantinlongx/i-steam.github.io.git"
    - git push --force target HEAD:main
