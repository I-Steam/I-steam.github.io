stages:
  - sync

sync_both_directions:
  stage: sync
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -eu
      : "${GITLAB_TOKEN:?Add masked CI/CD variable GITLAB_TOKEN with write_repository access to this GitLab project.}"
      : "${GITHUB_TOKEN:?Add masked CI/CD variable GITHUB_TOKEN with Contents read/write access to I-Steam/I-steam.github.io.}"
      git clone --branch main --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/I-Steam/I-steam.github.io.git" work
      cd work
      git config user.name "i-Steam mirror bot"
      git config user.email "mirror-bot@example.invalid"
      git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/chantinlongxthrx/i-steam.github.io.git"
      git fetch gitlab main
      if git merge-base HEAD refs/remotes/gitlab/main >/dev/null 2>&1; then
        if ! git merge --no-edit refs/remotes/gitlab/main; then
          # The Pages repo and GitLab mirror began independently. Prefer GitHub's
          # canonical root manifest/homepage, but keep the alternate source authored on GitLab.
          git checkout --ours -- AltSource.json README.md index.html 2>/dev/null || true
          git checkout --theirs -- alt/source.json 2>/dev/null || true
          git add -A
          git -c core.editor=true commit -m "Resolve website mirror conflicts with canonical source files"
        fi
      else
        if ! git merge --allow-unrelated-histories --no-edit refs/remotes/gitlab/main; then
          git checkout --ours -- AltSource.json README.md index.html 2>/dev/null || true
          git checkout --theirs -- alt/source.json 2>/dev/null || true
          git add -A
          git -c core.editor=true commit -m "Resolve initial website mirror conflicts"
        fi
      fi
      git push origin HEAD:main
      git push gitlab HEAD:main
